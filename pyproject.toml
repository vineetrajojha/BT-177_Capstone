[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bevfusionlite"
version = "0.1.0"
description = "BEVFusionLite: Lightweight Camera-LiDAR BEV Fusion 3D Detector"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "BEVFusionLite Team"},
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "easydict>=1.10",
    "tensorboardX>=2.6",
    "tqdm>=4.65",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "opencv-python>=4.8",
    "numba>=0.57",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist",
    "flake8",
    "black",
    "isort",
]

[tool.setuptools.packages.find]
include = ["bevfusionlite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
